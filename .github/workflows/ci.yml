name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: go build, vet, test
        run: |
          set -euo pipefail
          if [ ! -f go.mod ] || ! find . -name '*.go' -not -path './vendor/*' -print -quit | grep -q .; then
            echo "no Go sources yet - skipping"
            exit 0
          fi
          go build ./...
          go vet ./...
          go test -race ./...

      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(find scripts -name '*.sh' -type f 2>/dev/null | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell scripts yet - skipping"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning "${files[@]}"

      - name: markdownlint
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -name '*.md' -type f -not -path './.git/*' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no markdown yet - skipping"
            exit 0
          fi
          npx --yes markdownlint-cli2 "${files[@]}"

      - name: mac bootstrap self-test
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          ./scripts/mac/test-bootstrap.sh
          ./scripts/mac/test-image-refresh.sh
